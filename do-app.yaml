name: laxan-dashboard
region: nyc3
services:
  - name: backend
    github:
      repo: your-github-username/laxan-dashboard
      branch: main
      deploy_on_push: true
    source_dir: backend
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 5000
    envs:
      - key: DB_HOST
        value: ${db.HOSTNAME}
      - key: DB_USER
        value: ${db.USERNAME}
      - key: DB_PASSWORD
        value: ${db.PASSWORD}
      - key: DB_NAME
        value: ${db.DATABASE}
      - key: DB_PORT
        value: ${db.PORT}

static_sites:
  - name: frontend
    github:
      repo: your-github-username/laxan-dashboard
      branch: main
      deploy_on_push: true
    source_dir: frontend
    build_command: npm run build
    output_dir: dist
    envs:
      - key: VITE_API_URL
        scope: RUN_AND_BUILD_TIME
        value: ${backend.PUBLIC_URL}

databases:
  - name: db
    engine: MYSQL
    version: "8"
    production: false
